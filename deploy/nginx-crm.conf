# CekaTec / Core Manager — crm.ceka.com.ar
# Frontend estatico + proxy a la API Delphi (Windows)

server {
    listen 80;
    listen [::]:80;
    server_name crm.ceka.com.ar;

    root /var/www/crm.ceka.com.ar;
    index index.html;

    # Frontend (SPA de un solo archivo)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # La API vive en la PC Windows (cambiar por la IP real o la de Tailscale)
    location /api/ {
        proxy_pass http://192.168.1.50:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # envio de emails por SMTP
        client_max_body_size 20m;  # adjuntos en Base64
    }

    location = /health {
        proxy_pass http://192.168.1.50:8080/health;
        access_log off;
    }
}
