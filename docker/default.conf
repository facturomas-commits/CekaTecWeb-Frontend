# Frontend estático (SPA de un archivo). El dominio y el HTTPS los maneja Traefik/Easypanel.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;

    # La app es un solo HTML: no cachear para no quedarse con versiones viejas
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
